<title>pokeIO — Dashboard</title>
<style>
  :root{
    --bg:#0b0e0f; --panel:#12181a; --panel-2:#17201f;
    --line:#243130; --line-2:#33433f;
    --ink:#e8f2ef; --ink-dim:#a3b4b0; --ink-mute:#63736f;
    --accent:#37e08b; --cyan:#33bad6;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden;
    -webkit-font-smoothing:antialiased}
  .shell{height:100vh; display:flex; flex-direction:column}

  /* ---------------- tab bar ---------------- */
  .tabbar{flex:none; display:flex; align-items:stretch; height:46px; overflow:hidden;
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:11px; padding:0 17px; border-right:1px solid var(--line)}
  .mark{width:22px;height:22px;flex:none;border-radius:6px;position:relative;
    background:radial-gradient(circle at 32% 30%, #2b3d38, #10201b);
    box-shadow:inset 0 0 0 1px var(--line-2), 0 0 14px rgba(55,224,139,.14)}
  .mark::before,.mark::after{content:"";position:absolute;border-radius:50%}
  .mark::before{inset:5px;border:2px solid var(--accent);opacity:.85}
  .mark::after{left:9px;top:9px;width:3px;height:3px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .brand h1{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.05em}
  .brand h1 b{color:var(--accent)}

  .tabs{display:flex; align-items:stretch}
  .tab{display:flex; align-items:center; gap:9px; padding:0 22px; height:100%; cursor:pointer;
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-mute); background:none; border:0; border-right:1px solid var(--line);
    border-bottom:2px solid transparent; transition:color .14s, border-color .14s, background .14s}
  .tab:hover{color:var(--ink-dim)}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent); background:rgba(55,224,139,.06)}
  .tab .dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.45; transition:.14s}
  .tab.active .dot{opacity:1; box-shadow:0 0 8px var(--accent)}
  .tab .sub{font-size:8px; letter-spacing:.1em; color:var(--ink-mute); font-weight:500}
  .tab.active .sub{color:rgba(55,224,139,.6)}
  .tab .lbl{display:flex; flex-direction:column; align-items:flex-start; gap:1px; line-height:1.15}

  .grow{flex:1}
  .meta{display:flex; align-items:center; padding:0 16px; border-left:1px solid var(--line);
    font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute)}

  /* ---------------- frames ---------------- */
  .frames{flex:1; position:relative; min-height:0; background:var(--bg)}
  .frames iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg)}
  .frames iframe:not(.show){visibility:hidden; pointer-events:none}
  .booting{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute)}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>

<div class="shell">
  <div class="tabbar">
    <div class="brand"><div class="mark"></div><h1>poke<b>IO</b></h1></div>
    <div class="tabs">
      <button class="tab" data-tab="training">
        <span class="dot"></span>
        <span class="lbl"><span>Training Wall</span><span class="sub">NEAT · evolution</span></span>
      </button>
      <button class="tab" data-tab="brain">
        <span class="dot"></span>
        <span class="lbl"><span>Brain Wall</span><span class="sub">System-1 · gradient RL</span></span>
      </button>
    </div>
    <div class="grow"></div>
    <div class="meta" id="meta">one server · two walls</div>
  </div>
  <div class="frames">
    <div class="booting" id="booting">loading dashboards…</div>
    <iframe id="f-training" title="Training Wall (NEAT)" loading="lazy"></iframe>
    <iframe id="f-brain" title="Brain Wall (System-1)" loading="lazy"></iframe>
  </div>
</div>

<script>
(function(){
  "use strict";
  const params=new URLSearchParams(location.search);
  const TABS=["training","brain"];
  const loaded={};

  // initial tab: ?tab= wins, else remembered, else brain (the active System-1 work)
  let want=params.get("tab");
  if(!TABS.includes(want)){
    try{ want=localStorage.getItem("pokeio_tab"); }catch(e){}
    if(!TABS.includes(want)) want="brain";
  }

  function srcFor(name){
    if(name==="brain"){
      const run=params.get("run");
      return "/brain"+(run?("?run="+encodeURIComponent(run)):"");
    }
    return "/wall.html";
  }
  function show(name){
    if(!TABS.includes(name)) name="brain";
    const boot=document.getElementById("booting"); if(boot) boot.style.display="none";
    document.querySelectorAll(".tab").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===name);
    });
    TABS.forEach(function(n){
      const f=document.getElementById("f-"+n);
      if(n===name && !loaded[n]){ f.src=srcFor(n); loaded[n]=true; }   // lazy-load on first view; stays alive after
      f.classList.toggle("show", n===name);
    });
    try{ localStorage.setItem("pokeio_tab", name); }catch(e){}
    try{ const u=new URL(location.href); u.searchParams.set("tab", name); history.replaceState(null,"",u.toString()); }catch(e){}
    document.title="pokeIO — "+(name==="brain"?"Brain Wall":"Training Wall");
  }

  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ show(b.getAttribute("data-tab")); });
  });
  // keyboard: 1 / 2 to switch walls
  window.addEventListener("keydown", function(e){
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key==="1") show("training"); else if(e.key==="2") show("brain");
  });
  show(want);
})();
</script>
